<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#121a33"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#00BCD4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00BCD4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="0%" r="35%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00BCD4"/>
      <stop offset="100%" stop-color="#00838F"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Logo / brand mark -->
  <g transform="translate(80 80)">
    <rect width="64" height="64" rx="16" fill="url(#cyan)"/>
    <path d="M14 38c0-1 .4-2 1.2-3l3.4-9c.6-1.6 2-2.6 3.7-2.6h19.4c1.7 0 3.1 1 3.7 2.6l3.4 9c.8 1 1.2 2 1.2 3v6a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2v-2H22v2a2 2 0 0 1-2 2h-2a2 2 0 0 1-2-2v-6Z" fill="#fff"/>
    <text x="84" y="42" font-family="Poppins, Arial, sans-serif" font-size="28" font-weight="700" fill="#ffffff">GlobalPro</text>
  </g>

  <!-- Badge -->
  <g transform="translate(80 220)">
    <rect width="380" height="44" rx="22" fill="#ff6b00"/>
    <text x="190" y="29" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="600" fill="#ffffff">Desde $35.000 • Atención Hoy en RM</text>
  </g>

  <!-- H1 -->
  <text x="80" y="340" font-family="Poppins, Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff">Recarga de Gas Aire</text>
  <text x="80" y="408" font-family="Poppins, Arial, sans-serif" font-size="56" font-weight="800" fill="#ffffff">Acondicionado a <tspan fill="#00BCD4">Domicilio</tspan></text>

  <!-- Sub -->
  <text x="80" y="468" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="400" fill="#9fb3c8">Santiago RM • Llegamos en 60-90 min • Técnicos certificados</text>

  <!-- Stats row -->
  <g transform="translate(80 520)" font-family="Poppins, Arial, sans-serif">
    <g>
      <text x="0" y="24" font-size="32" font-weight="800" fill="#00BCD4">+10 años</text>
      <text x="0" y="56" font-size="16" fill="#9fb3c8">de experiencia</text>
    </g>
    <g transform="translate(280 0)">
      <text x="0" y="24" font-size="32" font-weight="800" fill="#00BCD4">52 comunas</text>
      <text x="0" y="56" font-size="16" fill="#9fb3c8">en Región Metropolitana</text>
    </g>
    <g transform="translate(620 0)">
      <text x="0" y="24" font-size="32" font-weight="800" fill="#ff6b00">60-90 min</text>
      <text x="0" y="56" font-size="16" fill="#9fb3c8">tiempo de respuesta</text>
    </g>
  </g>
</svg>
