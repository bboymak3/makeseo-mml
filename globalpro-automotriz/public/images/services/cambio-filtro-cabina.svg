<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00838F"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Filter shape -->
  <g transform="translate(200 150)" fill="#fff">
    <rect x="-50" y="-40" width="100" height="80" rx="8" fill="rgba(255,255,255,0.95)"/>
    <!-- Pleated lines -->
    <g stroke="#00838F" stroke-width="2" fill="none">
      <line x1="-35" y1="-30" x2="-35" y2="30"/>
      <line x1="-20" y1="-30" x2="-20" y2="30"/>
      <line x1="-5" y1="-30" x2="-5" y2="30"/>
      <line x1="10" y1="-30" x2="10" y2="30"/>
      <line x1="25" y1="-30" x2="25" y2="30"/>
      <line x1="40" y1="-30" x2="40" y2="30"/>
    </g>
    <!-- Carbon particles -->
    <circle cx="-25" cy="-10" r="2" fill="#1a1a1a"/>
    <circle cx="15" cy="5" r="2" fill="#1a1a1a"/>
    <circle cx="30" cy="-20" r="2" fill="#1a1a1a"/>
    <circle cx="-10" cy="20" r="2" fill="#1a1a1a"/>
  </g>
  <text x="200" y="260" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">Filtro Cabina</text>
</svg>
