<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Iniciar Sesión · Academia MML</title>
  <meta name="description" content="Inicia sesión en la Academia del Método Malla Local de Edward Valencia.">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #00BCD4;
      --primary-dark: #00838F;
      --accent: #ff6b00;
      --accent-light: #ff8c33;
      --whatsapp: #25D366;
      --dark: #0b1020;
      --dark-alt: #121a33;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-700: #374151;
      --danger: #ef4444;
      --success: #10b981;
      --radius: 14px;
      --radius-sm: 8px;
      --shadow: 0 4px 24px -8px rgba(11, 16, 32, 0.15);
    }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #0b1020 0%, #121a33 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #fff;
    }
    .login-card {
      background: rgba(18, 26, 51, 0.6);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(0, 188, 212, 0.2);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }
    .login-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(0, 188, 212, 0.1) 0%, transparent 50%);
      pointer-events: none;
    }
    .logo-wrap {
      text-align: center;
      margin-bottom: 28px;
      position: relative;
    }
    .logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 0 30px rgba(0, 188, 212, 0.5);
    }
    .logo-icon svg { width: 32px; height: 32px; color: #fff; }
    .logo-title {
      font-size: 22px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.02em;
    }
    .logo-subtitle {
      font-size: 12px;
      color: var(--primary);
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 4px;
    }
    .form-group { margin-bottom: 18px; position: relative; }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: rgba(255,255,255,0.8);
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(11, 16, 32, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 188, 212, 0.2);
    }
    .form-input::placeholder { color: rgba(255,255,255,0.3); }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-light));
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
      box-shadow: 0 8px 20px rgba(255, 107, 0, 0.3);
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(255, 107, 0, 0.4); }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      gap: 12px;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }
    .divider span {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      font-weight: 500;
    }
    .alert {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
    }
    .alert.error { background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; }
    .alert.success { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #6ee7b7; }
    .footer-link {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: rgba(255,255,255,0.5);
    }
    .footer-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .footer-link a:hover { text-decoration: underline; }
    .back-home {
      position: absolute;
      top: 20px;
      left: 20px;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .back-home:hover { color: var(--primary); }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 480px) {
      .login-card { padding: 32px 24px; }
      .back-home { top: 12px; left: 12px; }
    }
  </style>
</head>
<body>
  <a href="/" class="back-home">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
    Volver al inicio
  </a>

  <div class="login-card">
    <div class="logo-wrap">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 7l9-4 9 4M3 7v10l9 4 9-4V7M3 7l9 4 9-4M12 11v10"/>
        </svg>
      </div>
      <div class="logo-title">Academia MML</div>
      <div class="logo-subtitle">Edward Valencia · @makeseo</div>
    </div>

    <div id="alert" class="alert"></div>

    <form id="login-form">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input type="email" id="email" class="form-input" placeholder="tu@email.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" id="submit-btn" class="btn-primary">Iniciar sesión</button>
    </form>

    <div class="footer-link">
      ¿No tienes cuenta? <a href="/academia/register.html">Regístrate gratis</a><br>
      <a href="/academia/admin.html" style="font-size: 11px; opacity: 0.6;">Panel admin</a>
    </div>
  </div>

  <script>
    const API_BASE = '';
    const alertEl = document.getElementById('alert');
    const submitBtn = document.getElementById('submit-btn');

    function showAlert(message, type) {
      alertEl.textContent = message;
      alertEl.className = 'alert ' + type;
      alertEl.style.display = 'block';
    }

    function getToken() {
      return localStorage.getItem('mml_token') || sessionStorage.getItem('mml_token');
    }

    function setToken(token, remember) {
      if (remember) localStorage.setItem('mml_token', token);
      else sessionStorage.setItem('mml_token', token);
    }

    // Si ya hay token, redirigir a la academia
    if (getToken()) {
      window.location.href = '/academia/';
    }

    // Login con email/password
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const remember = true; // siempre recordar por ahora

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>Iniciando sesión...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password, remember }),
        });
        const data = await res.json();

        if (!res.ok) {
          showAlert(data.error || 'Error al iniciar sesión', 'error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Iniciar sesión';
          return;
        }

        setToken(data.token, remember);
        showAlert('¡Bienvenido! Redirigiendo...', 'success');
        setTimeout(() => { window.location.href = '/academia/'; }, 800);
      } catch (err) {
        showAlert('Error de conexión. Intenta nuevamente.', 'error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Iniciar sesión';
      }
    });
  </script>
</body>
</html>
